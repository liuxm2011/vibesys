name: Deploy Worker

on:
  push:
    paths:
      - 'backend/**'
    branches:
      - main

# 同一 ref 上串行部署，避免两次推送并发互相覆盖；不取消进行中的部署
concurrency:
  group: deploy-worker-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 部署门禁：后端 typecheck + test。任一失败，deploy job（needs: test）不会执行，
  # 从而保证「测试不过就不部署」。
  test:
    name: Backend typecheck & test (deploy gate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # 与 ci.yml 一致：集成测试会连接 SQLite 并读取 JWT_SECRET
    # （src/index.ts 缺少这两项会直接退出，CI 环境没有 .env）
    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci-only-not-a-real-secret"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Prepare test database
        run: pnpm exec prisma db push --skip-generate

      - name: Test
        run: pnpm test

  deploy:
    name: Deploy to Cloudflare Workers
    needs: test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml

      # 统一 pnpm + --frozen-lockfile 安装，构建依赖由 pnpm-lock.yaml 锁定，可复现。
      # postinstall 会执行 prisma generate，产出 src/generated/prisma。
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # wrangler-action 默认按 lockfile 探测包管理器；显式指定 pnpm，避免回退到 npm。
      # workingDirectory 相对于仓库根目录（不受上面 defaults.run.working-directory 影响），
      # 即在 backend/ 下、以 backend/wrangler.toml 执行 wrangler deploy。
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          packageManager: pnpm
          workingDirectory: backend

      # P0-4：wrangler-action 只 deploy 不创建 secret。部署后断言 Worker Secrets
      # 已配置——缺失意味着线上接口 500（登录依赖 JWT_SECRET、AI 依赖 MINIMAX_API_KEY）。
      # 断言放在 deploy 之后：secrets 配置是一次性人工操作，缺失时让本次 run 失败以示警，
      # 而非阻断已发生的部署。
      - name: Assert required Worker secrets
        run: |
          npx wrangler secret list | tee /tmp/secrets.json
          jq -e 'any(.[]; .name == "JWT_SECRET")' /tmp/secrets.json > /dev/null \
            || { echo "::error::Worker secret JWT_SECRET is not configured (run: npx wrangler secret put JWT_SECRET)"; exit 1; }
          jq -e 'any(.[]; .name == "MINIMAX_API_KEY")' /tmp/secrets.json > /dev/null \
            || { echo "::error::Worker secret MINIMAX_API_KEY is not configured (run: npx wrangler secret put MINIMAX_API_KEY)"; exit 1; }
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
